<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitBracket admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<header class="top">
  <h1>GitBracket <span>admin</span></h1>
  <div class="picks">
    <label>Tournament <select id="slug"></select></label>
    <label>Day <select id="day"></select></label>
  </div>
  <nav id="links" class="links" hidden>
    <a id="siteLink" target="_blank" rel="noopener">Bracket</a>
    <a id="kioskLink" target="_blank" rel="noopener">Live board</a>
  </nav>
  <div class="actions">
    <details id="pending" class="pending">
      <summary id="pendingBadge" class="badge"></summary>
      <ul id="pendingList"></ul>
    </details>
    <button id="undo" type="button">Undo</button>
    <button id="redo" type="button">Redo</button>
    <button id="publish" type="button" class="primary">Publish</button>
  </div>
</header>
<main>
  <section class="board">
    <div id="grid" class="grid" tabindex="-1"></div>
  </section>
</main>
<dialog id="modal" class="modal"></dialog>
<div id="flash" class="flash" hidden></div>
<script src="i18n.js"></script> <!-- derive.js's bundle — the admin is deliberately English (one operator), not localized -->
<script src="derive.js"></script>
<script src="app.js"></script>
</body>
</html>
