<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitBracket admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<header class="top">
  <h1>GitBracket <span>admin</span></h1>
  <div class="picks">
    <label>Tournament <select id="slug"></select></label>
    <label>Day <select id="day"></select></label>
  </div>
  <nav id="links" class="links" hidden>
    <span class="grp"><span class="lbl">Preview</span>
      <a id="previewLink" target="_blank" rel="noopener">Bracket</a>
      <a id="previewKiosk" target="_blank" rel="noopener">Live board</a></span>
    <span class="grp" id="publishedGroup"><span class="lbl">Published</span>
      <a id="siteLink" target="_blank" rel="noopener">Bracket</a>
      <a id="kioskLink" target="_blank" rel="noopener">Live board</a></span>
  </nav>
  <div class="actions">
    <details id="issues" class="pending" hidden>
      <summary id="issueBadge" class="badge"></summary>
      <ul id="issueList"></ul>
    </details>
    <details id="pending" class="pending">
      <summary id="pendingBadge" class="badge"></summary>
      <ul id="pendingList"></ul>
    </details>
    <button id="undo" type="button">Undo</button>
    <button id="redo" type="button">Redo</button>
    <button id="publish" type="button" class="primary">Publish</button>
  </div>
</header>
<p id="offline" class="offline" role="alert" hidden>Admin daemon unreachable — results are NOT being saved. Retrying…</p>
<main>
  <section class="board" id="board">
    <div id="grid" class="grid" tabindex="-1"></div>
  </section>
</main>
<dialog id="modal" class="modal"></dialog>
<div id="flash" class="flash" role="status" hidden></div>
<script src="i18n.js"></script> <!-- views.js's word bundle — the admin is deliberately English (one operator), not localized -->
<script src="derive.js"></script>
<script src="views.js"></script>
<script src="app.js"></script>
</body>
</html>
