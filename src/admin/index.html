<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitBracket admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<header class="top">
  <h1>GitBracket <span>admin</span></h1>
  <div class="picks">
    <label>Tournament <select id="slug"></select></label>
    <label>Day <select id="day"></select></label>
  </div>
  <div class="actions">
    <span id="pendingBadge" class="badge"></span>
    <button id="undo" type="button">Undo</button>
    <button id="publish" type="button" class="primary">Publish</button>
  </div>
</header>
<main>
  <section class="board">
    <p id="hint" class="hint"></p>
    <div id="scroll" class="scroll">
      <div id="grid" class="grid"></div>
    </div>
  </section>
  <aside class="panel">
    <section id="editor" hidden></section>
    <section id="pending">
      <h2>Pending changes</h2>
      <ul id="pendingList"></ul>
    </section>
  </aside>
</main>
<div id="sideModal" class="modal" hidden></div>
<div id="flash" class="flash" hidden></div>
<script src="derive.js"></script>
<script src="admin.js"></script>
</body>
</html>
