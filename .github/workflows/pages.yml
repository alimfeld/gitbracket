name: Deploy to GitHub Pages
# Dormant fallback since 2026-08: Vercel deploys on push; this keeps GH Pages
# serving the last snapshot and re-deploys manually when Vercel is unavailable.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The gate, re-run on every push: the pre-commit hook is the fast local
      # check, this is the enforced one — a bypassed hook can't ship.
      - run: node gb.js validate
      - run: node --test
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
