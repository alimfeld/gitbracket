name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The gate, re-run on every push: the pre-commit hook is the fast local
      # check, this is the enforced one — a bypassed hook can't ship.
      - run: node validate.js
      - run: node --test
      # Asset version tokens: script/style tags can't revalidate (data fetches
      # can), so each deploy stamps ?v=<commit sha> onto them. The repo tree
      # stays pristine; the token is the real SHA of the tree being deployed,
      # so a browser can never serve yesterday's JS with today's data.
      - run: |
          perl -i -pe 's{(app\.js|derive\.js|style\.css)(\?v=[^"]*)?"}{$1?v=$ENV{GITHUB_SHA}}g' site/*.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
