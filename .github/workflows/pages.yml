name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The gate, re-run on every push: the pre-commit hook is the fast local
      # check, this is the enforced one — a bypassed hook can't ship.
      - run: node validate.js
      - run: node --test
      # Asset version tokens: script/style tags can't revalidate (data fetches
      # can), so each deploy stamps ?v=<content hash> onto them. The repo tree
      # stays pristine; the token changes only when the asset's bytes change,
      # so a result-only commit leaves unchanged JS/CSS cached, while a changed
      # asset still gets a fresh URL a browser can't serve stale.
      - run: |
          for f in site/*.js site/*.css; do
            v=$(sha256sum "$f" | cut -c1-12)
            perl -i -pe "s{(\Q${f#site/}\E)(\?v=[^\"]*)?\"}{\${1}?v=$v\"}g" site/*.html
          done
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
